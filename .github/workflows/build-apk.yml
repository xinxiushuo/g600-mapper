name: Build APK

on:
  push:
    branches: [ main, master ]
    # 只改文档时不必重新打包（否则每次改 README 都会生成一个时间戳不同的新包，
    # 让人分不清本地那份是不是最新）
    paths:
      - 'android/app/**'
      - 'android/*.kts'
      - 'android/gradle.properties'
      - 'android/gradle/**'
      - 'keystore/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write        # 发布 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # app/build.gradle.kts 里含签名口令，本地不便直接改，就在 CI 里把版本号推上去。
      # 模式匹配不到也只是不改，不会让构建失败。
      - name: Bump version
        run: |
          F=android/app/build.gradle.kts
          sed -i -E 's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 3/' "$F"
          sed -i -E 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "1.2"/' "$F"
          grep -E 'version(Code|Name)' "$F" || true
        shell: bash

      # 把页面底部显示的构建时间换成真实编译时间(北京时间),
      # 这样每个包都能凭底部那行字区分, 不用靠 versionCode 猜
      - name: Stamp build time
        run: |
          STAMP=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          F=android/app/src/main/java/com/g600/mapper/AppInfo.kt
          sed -i "s|const val BUILD_STAMP = \"[^\"]*\"|const val BUILD_STAMP = \"$STAMP\"|" "$F"
          grep 'BUILD_STAMP =' "$F"
        shell: bash

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: G600Mapper-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 发到 Releases: 这样不登录 GitHub 也能直接下载 APK
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: G600 Mapper 最新构建
          body: |
            自动构建的 debug 版 APK，无需登录即可下载。

            直链：https://github.com/xinxiushuo/g600-mapper/releases/latest/download/app-debug.apk

            构建来源：${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
